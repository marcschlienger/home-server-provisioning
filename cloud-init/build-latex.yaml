#cloud-config
# =============================================================================
# LaTeX image build — runs on top of ubuntu-agents so workspaces inherit Node,
# native Claude, and the Codex/Pi first-boot installers.
# texlive-full is ~5 GB and takes 20–40 min to install; this is expected.
# =============================================================================

package_update: true
package_upgrade: false

packages:
  # Full TeX Live distribution — includes latexmk, biber, pdfcrop, and
  # essentially every package you will ever need.
  - texlive-full
  # Markdown → LaTeX → PDF pipeline
  - pandoc
  # PDF utilities (inspect, split, merge, crop, rasterize)
  - ghostscript
  - poppler-utils
  - pdf2svg
  # Image conversion tools useful in LaTeX workflows
  - imagemagick
  - inkscape

runcmd:
  - set -e

  - apt-get clean && rm -rf /var/lib/apt/lists/*

  # Validate only what is deliberately baked into the image. Codex and Pi are
  # installed and fully checked in each workspace VM during first boot.
  - /usr/local/sbin/verify-agent-clis --prerequisites

final_message: "LaTeX image build complete."
