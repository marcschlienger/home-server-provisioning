#cloud-config
# =============================================================================
# Agents image build — runs on top of ubuntu-base.
# Installs Claude Code from Anthropic's signed apt repository, Codex with its
# standalone installer, and Pi with its official installer, system-wide.
# API keys are NOT included here; they come in via dotfiles at launch time.
# =============================================================================

write_files:
  # Keep downloads and install destinations in one place. Derived images can
  # rerun these installers after large package transactions without duplicating
  # the vendor-specific invocation details.
  - path: /usr/local/sbin/install-codex-cli
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      case "${1:-}" in
        "") ;;
        --fresh)
          rm -f /usr/local/bin/codex
          rm -rf /usr/local/share/codex/packages/standalone
          ;;
        *)
          echo "Usage: $0 [--fresh]" >&2
          exit 2
          ;;
      esac

      installer=$(mktemp /run/codex-install.XXXXXX)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl -fsSL https://chatgpt.com/codex/install.sh -o "$installer"
      CODEX_INSTALL_DIR=/usr/local/bin \
        CODEX_HOME=/usr/local/share/codex \
        CODEX_NON_INTERACTIVE=1 \
        sh "$installer"

  - path: /usr/local/sbin/install-pi-cli
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      installer=$(mktemp /run/pi-install.XXXXXX)
      trap 'rm -f "$installer"' EXIT HUP INT TERM
      curl -fsSL https://pi.dev/install.sh -o "$installer"
      NPM_CONFIG_PREFIX=/usr/local TERM=dumb sh "$installer"

  # One executable defines the agent-image contract. The agents build, every
  # derived image, first boot, and later re-entry all run this same check.
  - path: /usr/local/sbin/verify-agent-clis
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      for command_name in node npm claude codex pi timeout; do
        if ! command -v "$command_name" >/dev/null 2>&1; then
          echo "ERROR: missing required command: $command_name" >&2
          exit 1
        fi
      done

      echo "==> Verifying Node.js 22"
      node -e 'process.exit(process.versions.node.split(".")[0] === "22" ? 0 : 1)'

      echo "==> Verifying Claude Code"
      timeout 30 claude --version

      echo "==> Verifying Codex"
      timeout 30 codex --version

      echo "==> Verifying Pi"
      pi_version=$(timeout 30 pi --version)
      case "$pi_version" in
        [0-9]*.[0-9]*.[0-9]*) ;;
        *) echo "Unexpected Pi version: $pi_version" >&2; exit 1 ;;
      esac
      printf '%s\n' "$pi_version"

runcmd:
  - set -e

  # Use Ubuntu 26.04's Node 22 packages for Pi. Remove any NodeSource state
  # inherited from an older base image first: apt will not otherwise replace
  # Node 24 with Ubuntu's lower-versioned package.
  - rm -f /etc/apt/sources.list.d/nodesource.list /etc/apt/sources.list.d/nodesource.sources /etc/apt/keyrings/nodesource.gpg /usr/share/keyrings/nodesource.gpg

  # Claude Code CLI (Anthropic). Use the signed stable apt channel: it is
  # system-wide, native, and intentionally skips releases with major regressions.
  - curl -fsSL https://downloads.claude.ai/keys/claude-code.asc -o /etc/apt/keyrings/claude-code.asc
  - >-
    test "$(gpg --show-keys --with-colons /etc/apt/keyrings/claude-code.asc
    | awk -F: '$1 == "fpr" { print $10; exit }')"
    = 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
  - echo 'deb [signed-by=/etc/apt/keyrings/claude-code.asc] https://downloads.claude.ai/claude-code/apt/stable stable main' > /etc/apt/sources.list.d/claude-code.list

  - apt-get update
  - apt-get purge -y nodejs npm
  - apt-get install -y nodejs npm claude-code

  # Codex CLI (OpenAI). The supported standalone installer avoids npm's
  # platform-specific optional-package failure mode and verifies its payload.
  - /usr/local/sbin/install-codex-cli

  # Pi coding agent. Pi's official installer remains npm-backed internally;
  # there is currently no native Pi binary distribution. Force /usr/local so
  # later APT transactions cannot replace npm's launcher under /usr/bin.
  - /usr/local/sbin/install-pi-cli

  - apt-get clean && rm -rf /var/lib/apt/lists/*

  # Keep the shared contract check last so the published image is known-good.
  - /usr/local/sbin/verify-agent-clis

final_message: "Agents image build complete."
