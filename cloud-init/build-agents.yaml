#cloud-config
# =============================================================================
# Agents image build — runs on top of ubuntu-base.
# Installs Claude Code, Codex, and Pi CLIs system-wide via npm.
# API keys are NOT included here; they come in via dotfiles at launch time.
# =============================================================================

runcmd:
  - set -e

  # Claude Code CLI (Anthropic)
  - npm install -g @anthropic-ai/claude-code

  # Codex CLI (OpenAI)
  - npm install -g @openai/codex

  # Pi coding agent
  - npm install -g --ignore-scripts @earendil-works/pi-coding-agent

  - apt-get clean && rm -rf /var/lib/apt/lists/*

  # Keep this chained check last. runcmd is one shell script, so an earlier
  # failed check followed by successful cleanup would otherwise exit zero.
  # Package identity also avoids accepting Debian's unrelated `pi` calculator.
  - >-
    npm list -g --depth=0 @anthropic-ai/claude-code
    && npm list -g --depth=0 @openai/codex
    && npm list -g --depth=0 @earendil-works/pi-coding-agent
    && command -v claude
    && command -v codex
    && command -v pi

final_message: "Agents image build complete."
